[package]
name = "example-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Template for Domain Container architecture Rust applications"
authors = ["Otto45 <austino45@gmail.com>"]
publish = false
default-run = "example-app"

[[bin]]
name = "example-app"
path = "src/main.rs"

[[bin]]
name = "example-app-http"
path = "src/bin/example_app_http.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-axum = "0.3.0"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# The layout names a folder and its main file alike (service_locator/service_locator.rs).
module_inception = "allow"
