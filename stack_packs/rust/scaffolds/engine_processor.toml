description = "An engine's processor: domain logic only that engine uses, in managers/engines/<within>/processors/<name>/; a singleton the ServiceLocator builds (get_<name>_processor). Needs `within`: the engine's name."
within = "src/managers/engines/{within}/{within}_engine.rs"

[[files]]
path = "src/managers/engines/{within}/processors/{name}/mod.rs"
template = "templates/processor_mod.rs"

[[files]]
path = "src/managers/engines/{within}/processors/{name}/{name}_processor.rs"
template = "templates/processor.rs"

[[insertions]]
path = "src/managers/engines/{within}/processors/mod.rs"
text = "pub mod {name};\n"

[[insertions]]
path = "src/managers/service_locator/service_locator.rs"
before = "use crate::managers::service_locator::service_locator_seams::ServiceLocatorSeams;"
text = "use crate::managers::engines::{within}::processors::{name}::{name}_processor::{Name}Processor;\n"

[[insertions]]
path = "src/managers/service_locator/service_locator.rs"
before = "    // The close() of every singleton created so far, in creation order."
text = "    {name}_processor: Mutex<Option<Arc<{Name}Processor>>>,\n"

[[insertions]]
path = "src/managers/service_locator/service_locator.rs"
before = "            close_callbacks: Mutex::new(Vec::new()),"
text = "            {name}_processor: Mutex::new(None),\n"

[[insertions]]
path = "src/managers/service_locator/service_locator.rs"
before = "    /// Closes every singleton this locator created, in reverse order of creation."
text = """    pub fn get_{name}_processor(&self) -> ApplicationResult<Arc<{Name}Processor>> {
        ServiceLocator::get_or_create(&self.{name}_processor, || Ok(Arc::new({Name}Processor)))
    }

"""
