[package]
name = "otto-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A coding agent harness that builds Domain Container architecture apps"
authors = ["Otto45 <austino45@gmail.com>"]
publish = false
default-run = "otto"

[[bin]]
name = "otto"
path = "src/bin/otto.rs"

[[bin]]
name = "otto-http"
path = "src/bin/otto-http.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
reqwest = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "io-std", "io-util", "fs", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uuid = { version = "1", features = ["v4"] }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
globset = "0.4.21"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
# The WebSocket transport's TLS: aws-lc-rs named explicitly (as reqwest does for the HTTP transport) and the
# platform's certificate verifier (as reqwest uses), so neither depends on a process-wide default provider.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8.9", features = ["macros"] }
utoipa = { version = "6.0.0", features = ["chrono"] }
utoipa-axum = "0.3.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
subtle = "2.6.1"
# Names an app's lock file after its folder's path, whatever its length.
sha2 = "0.10"
similar = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# The layout names a folder and its main file alike (service_locator/service_locator.rs).
module_inception = "allow"
