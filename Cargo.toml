[package]
name = "otto-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A coding agent harness that builds Domain Container architecture apps"
authors = ["Otto45 <austino45@gmail.com>"]
publish = false
default-run = "otto"

[[bin]]
name = "otto"
path = "src/bin/otto.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
regex = "1"
reqwest = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "io-std", "io-util", "fs", "process", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# The layout names a folder and its main file alike (service_locator/service_locator.rs).
module_inception = "allow"
